<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer le mot de passe — WorkMap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="main-nav"></nav>

  <main>
    <h1>Changer mon mot de passe</h1>

    <p id="forced-notice" class="notice" hidden>
      Votre mot de passe a été généré automatiquement.
      Vous devez le changer avant de pouvoir utiliser l'application.
    </p>

    <form id="change-password-form">
      <label>
        Mot de passe actuel
        <input type="password" name="current_password" required>
      </label>

      <label>
        Nouveau mot de passe (10 caractères minimum)
        <input type="password" name="new_password" required minlength="10">
      </label>

      <label>
        Confirmer le nouveau mot de passe
        <input type="password" name="new_password_confirm" required minlength="10">
      </label>

      <button type="submit">Changer le mot de passe</button>
    </form>

    <p id="message"></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/change-password.js"></script>
    <script>initNav();</script>
</body>
</html>
