<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modération — WorkMap</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/index.html">WorkMap</a> — Modération</h1>
    <nav id="main-nav" aria-label="Navigation principale"></nav>
  </header>

  <main>
    <div id="msg" class="message"></div>

    <section>
      <h2>Signalements</h2>
      <p id="reports-empty" class="message"></p>
      <table id="reports-table">
        <thead>
          <tr>
            <th>Contribution</th><th>Motif</th><th>Commentaire</th>
            <th>État</th><th>Effet</th><th>Statut</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Demandes de correction</h2>
      <p id="corrections-empty" class="message"></p>
      <table id="corrections-table">
        <thead>
          <tr>
            <th>Organisation</th><th>Champ</th><th>Valeur actuelle</th>
            <th>Valeur proposée</th><th>Demandeur</th><th>Statut</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/moderation.js"></script>
  <script>initNav();</script>
</body>
</html>
